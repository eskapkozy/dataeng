<svg version="1.0" xmlns="http://www.w3.org/2000/svg" width="944" height="1139" viewBox="0 0 944 1139" preserveAspectRatio="xMidYMid meet">
  <!-- Définitions pour le design system Data Eng -->
  <defs>
    <!-- Pattern de points bleus extrêmement gros et peu nombreux -->
    <pattern id="dotPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="18" fill="var(--accent-blue, #4F6EF7)" opacity="0.8"/>
    </pattern>
    
    <!-- Gradient pour le fill principal -->
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--accent-blue, #4F6EF7);stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:var(--bg-surface, #FDFCF9);stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:var(--active-green, #3ecf8e);stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Gradient pour Brazzaville -->
    <radialGradient id="brazzavilleGradient">
      <stop offset="0%" style="stop-color:var(--accent-blue, #4F6EF7);stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--active-green, #3ecf8e);stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Filtre pour effet de brillance -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Groupe principal pour la carte du Congo -->
  <g fill="url(#mapGradient)" stroke="var(--accent-blue, #4F6EF7)" stroke-width="3" opacity="1">
    <!-- Overlay pattern pour texture -->
    <g fill="url(#dotPattern)" stroke="none" opacity="1">
