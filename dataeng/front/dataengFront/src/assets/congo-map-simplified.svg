    </g>
  </g>
  
  <!-- Point pour Brazzaville avec design Data Eng -->
  <g id="brazzaville-point" transform="translate(501, 893)">
        
    <!-- Sphère de présence principale -->
    <circle cx="0" cy="0" r="10" fill="url(#brazzavilleGradient)" opacity="0.9" filter="url(#glowEffect)">
      <animate attributeName="r" values="10;150;10" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cercle intérieur brillant -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.9">
      <animate attributeName="r" values="6;80;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Point central lumineux -->
    <circle cx="0" cy="0" r="3" fill="var(--accent-blue, #4F6EF7)">
      <animate attributeName="opacity" values="1;0.5;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Points satellites data - orbite -->
    <g opacity="0.9">
      <circle cx="-15" cy="0" r="2.5" fill="var(--accent-blue, #4F6EF7)">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="-15;-18;-15" dur="2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="0" r="2.5" fill="var(--active-green, #3ecf8e)">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="15;18;15" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-15" r="2.5" fill="var(--accent-purple, #7B5CF5)">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-15;-18;-15" dur="2s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Point additionnel aux coordonnées 407, 407 -->
  <g id="point-additionnel" transform="translate(407, 407)">
    <!-- Point principal -->
    <circle cx="0" cy="0" r="8" fill="var(--warning-orange, #F5A623)" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cercle extérieur pulse -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="var(--warning-orange, #F5A623)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Point central brillant -->
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Point Oyo aux coordonnées 631, 550 -->
  <g id="oyo-point" transform="translate(631, 550)">
    <!-- Point principal -->
    <circle cx="0" cy="0" r="8" fill="var(--accent-cyan, #22d3ee)" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cercle extérieur pulse -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="var(--accent-cyan, #22d3ee)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="12;18;12" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Point central brillant -->
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Label Oyo -->
    <text x="0" y="-20" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="10" font-weight="700" fill="var(--accent-cyan, #22d3ee)" opacity="0.9">
      OYO
    </text>
  </g>
  
  <!-- Point additionnel sur la même ligne que Brazzaville -->
  <g transform="translate(120, 935)">
    <!-- Ligne pointillée vers le bas -->
    <line x1="0" y1="0" x2="0" y2="15" stroke="var(--accent-purple, #7B5CF5)" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
    
    <!-- Point principal -->
    <circle cx="0" cy="0" r="7" fill="var(--accent-purple, #7B5CF5)" opacity="0.8">
      <animate attributeName="r" values="7;11;7" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cercle extérieur pulse -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="var(--accent-purple, #7B5CF5)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="11;18;11" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Point central brillant -->
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.9">
      <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Label Pointe Noire -->
    <text x="0" y="-20" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="10" font-weight="700" fill="var(--accent-purple, #7B5CF5)" opacity="0.9">
      POINTE NOIRE
    </text>
  </g>
</svg>
